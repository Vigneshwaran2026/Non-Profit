<!DOCTYPE html>
<html lang="zxx">

<head>
	<!-- Meta -->
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

    <title>404 Error</title>
	<!-- Mouse Cursor Css File -->
	<link rel="stylesheet" href="css/mousecursor.css">
	<!-- Main Custom Css -->

    <style>


:root{
	--primary-color			: #020D19;
	--secondary-color		: #F8F8F8;
	--text-color			: #828282;
	--accent-color			: #FF6D00;
	--white-color			: #FFFFFF;
	--divider-color			: #020D1914;
	--dark-divider-color	: #FFFFFF1A;
	--error-color			: rgb(230, 87, 87);
	--default-font			: "Inter", serif;
	--accent-font			: "Onest", serif;
}

        html, body {
    height: 100%;
    overflow: hidden !important;

    .btn-default{
	position: relative;
    display: inline-block;
    background: var(--accent-color);
    color: var(--white-color);
	font-family: var(--accent-font);
    font-size: 16px;
    font-weight: 700;
    line-height: 1em;
    text-transform: capitalize;
    border: none;
    padding: 20px 54px 20px 24px;
	border-radius: 100px;
    text-decoration: none;
    transition: all 0.5s ease-in-out;
    overflow: hidden;
    z-index: 0;
}

.btn-default:hover{
	background: transparent;
    color: var(--white-color);
}

.btn-default::before{
	content: '';
    position: absolute;
    top: 50%;
    right: 0;
    width: 20px;
    height: 20px;
    background-image: url(../images/arrow-white.webp);
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
    transform: translate(-24px, -50%);
    transition: all 0.4s ease-in-out;
}

.btn-default:hover::before{
	transform: translate(-21px, -50%);
}

.btn-default::after{
	content: '';
    display: block;
    position: absolute;
    top: 0;
    bottom: 0;
    left: auto;
	right: 0;
    width: 0;
    height: 100%;
    background: var(--primary-color);
	border-radius: 100px;
    transition: all 0.4s ease-in-out;
    z-index: -1;
}

.btn-default:hover:after{
	width: 100%;
    left: 0;
	right: auto;
}

    /************************************/
/***    34. 404 Error Page css    ***/
/************************************/

.error-page{
	padding: 100px 0;
}

.error-page-image{
	text-align: center;
	margin-bottom: 30px;
}

.error-page-image img{
	width: 100%;
	max-width: 60%;
}

 .error-page-content{
	text-align: center;
}

.error-page-content .section-title{
	margin-bottom: 15px;
}

/* 404 Page Full Screen Fix */
.error-page {
	margin-top: -20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.error-page .container,
.error-page .row,
.error-page .col-lg-12 {
    height: 100%;
}

.error-page-content {
    text-align: center;
}

.error-page-image img {
    max-height: 500px;
    width: auto;
}

}
    </style>
</head>
<body>
    <!-- error section start -->
    <div class="error-page">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="error-page-image wow fadeInUp">
                        <img src="images/404-error-img.webp" alt="">
                    </div>
                    <div class="error-page-content">
                        <div class="section-title">
                            <h2 class="text-anime-style-2" data-cursor="-opaque">Oops! <span>page not found</span></h2>
                        </div>
                        <div class="error-page-content-body">
                            <p class="wow fadeInUp" data-wow-delay="0.25s">Sorry, We can't find the page you're looking.</p>
                            <a class="btn-default wow fadeInUp" data-wow-delay="0.5s" href="index.html">back to home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- error section end -->
</body>
    </html>
